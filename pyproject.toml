[project]
name = "khmer-translit"
version = "0.2.0"
description = "Latin → Khmer transliteration for Khmer TTS: a small learned model (NumPy inference), rules and the Google Khmer lexicon"
requires-python = ">=3.10,<3.13"
license = "PolyForm-Noncommercial-1.0.0"   # code only (owner, 2026-10-29); model weights are licensed separately
license-files = ["LICENSE"]
dependencies = ["numpy>=2"]   # serving needs NumPy only

[project.optional-dependencies]
byt5 = [                      # the ByT5 research-preview backend (khmer_translit.byt5); tested with these versions
    "torch>=2.14,<3",
    "transformers>=5.19,<6",
    "safetensors>=0.8",
]

[project.scripts]
khmer-translit = "khmer_translit.cli:main"

[dependency-groups]
train = [                     # data building, training, experiment tracking
    "torch==2.14.0",          # the same build as the speech repo's upstream env (shared uv cache)
    "pyarrow>=17",
    "wandb>=0.30.0",
    "pyyaml>=6.0.3",
]

[tool.uv]
default-groups = ["train"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/khmer_translit"]

[tool.hatch.build.targets.sdist]
include = ["/src/khmer_translit", "/README.md", "/pyproject.toml"]
