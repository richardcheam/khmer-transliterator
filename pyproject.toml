[project]
name = "khmer-translit"
version = "0.3.0"
description = "English word -> Khmer phonetic spelling: a small NumPy model and a ByT5 LoRA adapter"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"                              # the code; model weights (Hugging Face) and training data: CC BY-SA 4.0
license-files = ["LICENSE"]
authors = [{ name = "Richard Cheam" }]
keywords = ["khmer", "transliteration", "english", "phonetic", "loanwords", "nlp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
    "Development Status :: 4 - Beta",
]
dependencies = ["numpy>=2"]

[project.optional-dependencies]
hub = ["huggingface_hub>=0.24"]                                     # download the published models on first use
byt5 = ["huggingface_hub>=0.24", "torch>=2.14,<3", "transformers>=5.19,<6", "safetensors>=0.8"]   # tested versions

[project.scripts]
khmer-translit = "khmer_translit.cli:main"

[project.urls]
Homepage = "https://github.com/richardcheam/khmer-transliterator"
"Small model" = "https://huggingface.co/ric912/en-km-phonetic-transliterator"
"ByT5 adapter" = "https://huggingface.co/ric912/en-km-phonetic-byt5-lora"
Issues = "https://github.com/richardcheam/khmer-transliterator/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/khmer_translit"]
