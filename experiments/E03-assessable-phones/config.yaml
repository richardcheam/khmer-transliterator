experiment: E03-assessable-phones
description: letters vs letters+English phones on dictionary-assessable, consonant-screened (DACS) mined pairs after repairing the khmer_like selection rule

paths:
  runs_dir: models/e03            # one folder per job: <arm>_s<seed>

model:                            # translit_train.Model, unchanged from E02
  d: 192
  layers: 3                       # 3 encoder + 3 decoder
  heads: 4
  ff: 512
  dropout: 0.1

train:                            # unchanged from E02 (no schedule sweep)
  epochs: 40
  batch: 128
  lr: 0.001                       # AdamW, linear warm-up then cosine to 0 over the supervised steps
  weight_decay: 0.01
  warmup: 500
  label_smoothing: 0.1
  grad_clip: 1.0
  threads: 6
  phone_dropout: 0.1              # phones arm: share of training examples encoded <no_pron> (private RNG, drawn in both arms)

p2g:                              # required by the shared config schema; UNUSED in E03 (no P2G, no replay)
  epochs: 10
  max_hours: 2.0
  lr: 0.001
  warmup: 500
  batch: 128
  replay_every: 8
  replay_batch: 128

eval:
  beam: 4                         # scoring: raw beam-4 top-1 (validation: greedy top-1)
  top_k: 4
